# Deploy n8n on Render with PostgreSQL

services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service

    image:
      url: docker.io/n8nio/n8n:latest

    envVars:
      # n8n encryption key
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # Reduce Node.js memory usage
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"

      # Disable task runners
      - key: N8N_RUNNERS_ENABLED
        value: "false"

      # Public n8n URL
      - key: N8N_HOST
        value: n8n-service-kd6y.onrender.com

      - key: N8N_PROTOCOL
        value: https

      - key: WEBHOOK_URL
        value: https://n8n-service-kd6y.onrender.com/

      # PostgreSQL
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database

      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host

      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

databases:
  - name: n8n-db
    plan: free
